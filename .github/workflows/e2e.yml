name: E2E

run-name: E2E ${{ inputs.ref || github.ref }}

# Why: checkout + artifact upload only; callers can only further restrict.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out (defaults to the calling workflow's ref)
        required: false
        type: string
      test_files:
        description: JSON array of changed specs; empty runs the full suite
        required: false
        type: string
      project:
        description: Extra Playwright project for those specs, e.g. electron-ondemand
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to check out (defaults to the workflow ref)
        required: false
        type: string
      test_files:
        description: JSON array of specs to run; empty runs the full suite
        required: false
        type: string
      project:
        description: Extra Playwright project for those specs, e.g. electron-ondemand
        required: false
        type: string
  schedule:
    # Why: GitHub cron uses UTC; these slots map to 10am and 3pm
    # America/Phoenix for the default-branch E2E run.
    - cron: '0 17,22 * * *'

jobs:
  build:
    name: build e2e app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed_shards: ${{ steps.changed-shards.outputs.matrix }}
      suite_shards: ${{ steps.suite-shards.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Why: the E2E build compiles native modules via node-gyp. Mirrors the
      # install step in pr.yml's verify job so E2E doesn't hit missing-toolchain
      # errors.
      - name: Install native build tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: build-essential python3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # Why here: changed-e2e needs its matrix before it starts, and this job runs first anyway.
      - name: Split changed specs into shards
        id: changed-shards
        env:
          TEST_FILES_JSON: ${{ inputs.test_files }}
        run: node config/scripts/split-changed-e2e-specs.mjs

      # Why measured durations: --shard cuts by test count, so the slow team-panel specs, which sort
      # together, filled one shard past its cap (ORCA-1148). The plan reads config/e2e-spec-durations.json.
      - name: Plan full-suite shards
        id: suite-shards
        run: node config/scripts/split-e2e-suite-specs.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Why: this job runs the same pnpm install path as pr.yml's verify
      # job, so it needs the same pinned node-gyp override to avoid pnpm's
      # broken bundled gyp_main.py on Linux.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Why: building here avoids parallel builds inside Playwright globalSetup;
      # paired-browser specs also need the standalone web bundle.
      - name: Build Electron app for E2E
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          npx electron-vite build --mode e2e
          pnpm run build:web-from-renderer
          pnpm run build:relay

      - name: Check E2E spec coverage
        run: pnpm run check:e2e-spec-coverage

      # Why include-hidden-files: the relay's per-platform .version marker is a
      # dotfile, and upload-artifact drops those by default. Without it the shard
      # gets relay.js but no marker, and SSH specs fail on "missing its version marker".
      - name: Upload E2E build output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-out
          path: out/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  e2e:
    name: e2e ${{ matrix.shard_name }}
    needs: build
    if: inputs.test_files == ''
    runs-on: ubuntu-latest
    # Why 45: one shard took 27.0 min against the old 30 when --shard cut the sorted list by test
    # count (ORCA-215), and shard 8 later hit 45 with the team-panel specs stacked on it (ORCA-1148).
    # The build job now balances shards by measured duration; the cap stays as headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.suite_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Why: pnpm install rebuilds native modules, and those postinstall
      # scripts still need the Linux toolchain even though this shard reuses
      # the prebuilt Electron output.
      # Why fonts-noto-cjk: ubuntu-latest carries no font with Korean coverage
      # (`fc-list :lang=ko` is empty), so a spec measuring CJK glyph metrics
      # measures a tofu box instead of Hangul.
      # Why xvfb: Electron on Linux needs an X display even when the app
      # suppresses mainWindow.show() via ORCA_E2E_HEADLESS. xvfb provides a
      # virtual framebuffer so Chromium can initialize without a real display.
      - name: Install native build tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: build-essential fonts-noto-cjk python3 xvfb zsh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Why: this job runs the same pnpm install path as pr.yml's verify
      # job, so it needs the same pinned node-gyp override to avoid pnpm's
      # broken bundled gyp_main.py on Linux. Gate on runner.os matches
      # release.yml so the invariant "this workaround is Linux-only" is
      # consistent across all three workflows, even though this job
      # currently pins runs-on: ubuntu-latest.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E build output
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-out
          path: out/

      # Why here and not in the build job: this is the only E2E job whose relay
      # comes solely from the artifact — globalSetup rebuilds it in place wherever
      # ORCA_E2E_SSH_DOCKER is set. A stripped .version surfaces as an SSH spec
      # whose locator never resolves, so fail on the marker instead.
      - name: Verify the relay bundle kept its version markers
        run: node config/scripts/verify-relay-version-markers.mjs

      # Why: the Electron suite is wall-clock constrained on OSS runners, but
      # multiple Electron apps on one Xvfb VM contend on git/Chromium resources.
      # Sharding keeps each VM at one Playwright worker while splitting the
      # headless suite across separate runners.
      # SKIP_BUILD makes Playwright globalSetup reuse the single build job's
      # artifact instead of starting five concurrent electron-vite builds.
      # ORCA_E2E_FORWARD_APP_LOGS keeps startup failures visible when Electron
      # launches but never creates a BrowserWindow.
      # Why a test list and not file arguments: arguments are regexes, so tabs.spec.ts would also
      # pick up every *-tabs.spec.ts; list lines match one file, relative to the config's testDir.
      - name: Run E2E tests (${{ matrix.shard_name }})
        env:
          TEST_FILES_JSON: ${{ matrix.files }}
        run: |
          jq -r '.[] | sub("^tests/e2e/"; "")' <<<"$TEST_FILES_JSON" > "$RUNNER_TEMP/e2e-shard-specs.txt"
          xvfb-run --auto-servernum env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e --test-list "$RUNNER_TEMP/e2e-shard-specs.txt"

      # Why always() and why the attempt is in the name: the base failure rate needs
      # the green runs as its denominator, and re-running one shard must not overwrite
      # the attempt that failed. Harvested by config/scripts/e2e-failure-rate-report.mjs.
      - name: Upload E2E JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-report-${{ matrix.shard_name }}-attempt-${{ github.run_attempt }}
          path: tests/test-results/e2e-report.json
          retention-days: 30
          if-no-files-found: warn

      # Why: Playwright retains traces/screenshots only on failure. Uploading
      # them as an artifact makes post-mortem debugging on CI possible without
      # re-running locally.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard_name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  changed-e2e:
    name: changed e2e specs ${{ matrix.name }}
    needs: build
    # Why both: an empty matrix fails the run, so the split's '[]' must skip before it expands.
    if: inputs.test_files != '' && needs.build.outputs.changed_shards != '[]'
    runs-on: ubuntu-latest
    # Why shards and not a higher cap: one runner took 28-30 min for the panel branch's 16 specs
    # and each new spec added to it (ORCA-1120). The split keeps a short list on one runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.changed_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Why fonts-noto-cjk: same reason as the sharded job — a changed CJK spec
      # lands here instead.
      - name: Install native build and headless UI tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: build-essential fonts-noto-cjk openbox python3 wmctrl xvfb zsh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Use external node-gyp to avoid pnpm's bundled copy
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E build output
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-out
          path: out/

      # Why PROJECT: electron-headless excludes @ondemand diagnostics and its
      # grepInvert wins over any --grep, so reaching one needs its own project
      # added to the run.
      - name: Run changed E2E specs
        env:
          TEST_FILES_JSON: ${{ matrix.files }}
          PROJECT: ${{ inputs.project }}
        run: |
          mapfile -t TEST_FILES < <(jq -r '.[]' <<<"$TEST_FILES_JSON")
          E2E_ENV=(SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1)
          if printf '%s\n' "${TEST_FILES[@]}" | grep -qx 'tests/e2e/ephemeral-vm-provisioned-root.spec.ts'; then
            E2E_ENV+=(ORCA_E2E_SSH_DOCKER=1)
          fi
          E2E_PROJECT_ARGS=()
          if [ -n "$PROJECT" ]; then
            E2E_PROJECT_ARGS+=(--project "$PROJECT")
          else
            # Why added and not chosen between: test:e2e already pins
            # electron-headless, whose grepInvert drops both tags, so a changed
            # spec carrying one collects zero tests and the job dies on
            # "No tests found" — green nowhere, red here.
            if grep -l '@headful' "${TEST_FILES[@]}" >/dev/null; then
              E2E_PROJECT_ARGS+=(--project=electron-headful)
            fi
            if grep -l '@ondemand' "${TEST_FILES[@]}" >/dev/null; then
              E2E_PROJECT_ARGS+=(--project=electron-ondemand)
            fi
          fi
          WITH_WM=0
          case " ${E2E_PROJECT_ARGS[*]} " in *electron-headful*) WITH_WM=1 ;; esac
          # Why openbox: bare Xvfb has no window manager, so minimize() is a no-op and @headful specs never see isMinimized().
          xvfb-run --auto-servernum bash -c '
            if [ "$0" = 1 ]; then
              openbox >/dev/null 2>&1 &
              timeout 10 bash -c "until wmctrl -m >/dev/null 2>&1; do sleep 0.2; done"
            fi
            exec "$@"
          ' "$WITH_WM" env "${E2E_ENV[@]}" \
            pnpm run test:e2e "${TEST_FILES[@]}" --workers=1 "${E2E_PROJECT_ARGS[@]}"

      - name: Upload E2E JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-report-changed-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: tests/test-results/e2e-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-changed-${{ matrix.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  ssh-docker-watcher-isolation:
    name: ssh docker watcher isolation
    needs: build
    if: inputs.test_files == ''
    runs-on: ubuntu-latest
    # Why 35: the terminal parking + retention specs below add two more
    # docker-rig tests capped at 240s each on top of the watcher isolation pair.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install native build and headless UI tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: build-essential fonts-noto-cjk openssh-client python3 xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Why: same Linux-only node-gyp pin as build/e2e jobs so the workaround
      # stays consistent across workflows even while this job is ubuntu-latest.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E build output
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-out
          path: out/

      # Why: this is the release-path proof that the deployed Linux relay keeps
      # its PTY and explorer live across a real watcher SIGSEGV.
      # Why the per-suite output file: both suites in this job share one config, so
      # they resolve the same `outputFile` and the second overwrites the first —
      # uploading that reports one suite while reading as the whole job (ORCA-266).
      - name: Run Docker SSH watcher isolation E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e-report-ssh-docker-watcher-isolation.json
        run: xvfb-run --auto-servernum env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e:ssh-docker-watcher-isolation

      # Why always(): these specs gate the C1 terminal parking/retention budget
      # over a real SSH host and run in no other lane, so a watcher-isolation
      # failure above must not silently skip them.
      - name: Run Docker SSH terminal parking + retention E2E
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e-report-ssh-docker-terminal-parking.json
        run: xvfb-run --auto-servernum env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e:ssh-docker-terminal-parking

      # Why the repo-root path: PLAYWRIGHT_JSON_OUTPUT_FILE resolves against cwd,
      # while the config's own outputFile resolves against tests/ — so these two
      # land beside the checkout, not under tests/test-results.
      - name: Upload SSH docker E2E JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-report-ssh-docker-attempt-${{ github.run_attempt }}
          path: test-results/e2e-report-ssh-docker-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload watcher isolation traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-ssh-docker-watcher-isolation
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
