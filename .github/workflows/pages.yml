name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_unmerged:
        description: Confirm deployment of unmerged site content
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/user/**"
      # Why: site/scripts/sync-docs.mjs copies these into the docs and the landing.
      - "docs/reference/orchestrator-game.md"
      - "docs/reference/headless-linux-server.md"
      - "docs/reference/plugin-development.md"
      - "docs/reference/orca-sonar.md"
      - "docs/assets/readme/**"
      - "resources/build/icon.png"
      - "src/shared/task-providers.ts"
      - "src/shared/tui-agent-display-names.ts"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_unmerged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Installs site/'s own lockfile, runs `pnpm build` (docs sync + astro build) and
      # uploads site/dist as the Pages artifact.
      - name: Build site
        uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_unmerged
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
