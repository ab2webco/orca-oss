# The desktop app is a single-project install. `mobile/` is a separate workspace
# with its own pnpm-workspace.yaml and lockfile, so keep it out of the root
# package graph. Without this file `pnpm -r` auto-discovers mobile/ and its
# nested package, and the root's patchedDependencies fail as ERR_PNPM_UNUSED_PATCH.
packages: []

# Keep every override here: a pnpm.overrides block in package.json replaces this one whole.
overrides:
  # One katex for every consumer: main.css imports the root's katex.min.css, and 0.18 prefixed its classes (ORCA-994).
  katex: $katex
  # GHSA-cg2g-xh64-v4q7 (critical), GHSA-mrv2-3pqr-j5jr; matches the app's dompurify after #888.
  monaco-editor>dompurify: 3.4.17
  # GHSA-22jm-h49p-29qw, GHSA-46jr-4wx8-v453, GHSA-6qxp-vccf-f47h, GHSA-f897-62hf-6gxq
  '@modelcontextprotocol/sdk@^1': 1.32.0
  # GHSA-4w3w-2rp5-g8jm, GHSA-w2rr-34g9-rvrj, GHSA-27p8-2357-5qqv and 5 more xmldom advisories
  '@xmldom/xmldom@^0.8': 0.8.15
  # GHSA-27r3-jxmh-p828
  body-parser@^2: 2.4.0
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  brace-expansion@^1: 1.1.20
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  brace-expansion@^2: 2.1.6
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  brace-expansion@^5: 5.0.11
  # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx
  browserslist@^4: 4.28.7
  # GHSA-f65p-4m7j-42xc, GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3, GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8
  fast-uri@^3: 3.1.7
  # GHSA-2883-xcg3-v3hh
  js-yaml@^4: 4.3.2
  # GHSA-2v37-7h3g-55p8
  nanoid@^3: 3.3.18
  # GHSA-c8x8-7fp4-3x9w: paste XSS; ships in the renderer via @tiptap/pm
  prosemirror-view@^1: 1.42.8
  # prosemirror-view 1.42.8 needs ^1.25.12; one copy keeps Node/Schema instanceof checks working
  prosemirror-model@^1: 1.25.12
  # GHSA-jqcg-44mw-7w3h (critical)
  proxy-addr@^2: 2.0.8
  # GHSA-7w5x-hrqm-74c2
  smol-toml@^1: 1.7.1
  # 7.4.20 is a partial publish npm marks deprecated (remusao/tldts#2735); 7.4.22 is under the 3-day release age.
  tldts-core@^7: 7.4.19
  # GHSA-68fv-2mgg-jv7q
  source-map-js@^1: 1.2.2
  # GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr (critical)
  tinypool@^2: 2.1.2
  # GHSA-xjj6-f33q-929c, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-rfgv-xxqx-mfg5
  undici@^6: 6.29.1
  # GHSA-xjj6-f33q-929c, GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-2m5v-pch6-74hx, GHSA-4w7w-5xrc-9h26
  undici@^7: 7.30.1

peerDependencyRules:
  allowedVersions:
    # 3.22.5 declares ^0.16.4 but only calls katex.render, which 0.18 kept; 3.32 declares ^0.18.0.
    '@tiptap/extension-mathematics>katex': '0.18'
